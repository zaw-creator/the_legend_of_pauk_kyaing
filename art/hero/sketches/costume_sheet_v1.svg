<ellipse cx="1600" cy="900" rx="80" ry="9" fill="#000" opacity="0.12"/>
<text x="320" y="150" text-anchor="middle" class="h">A. Pyu-era scholar</text>
<text x="320" y="178" text-anchor="middle" class="s">faithful to the oldest sources</text>
<text x="50" y="950" class="n">• Hair in a topknot, tied with white cotton</text>
<text x="50" y="980" class="n">• Bare chest; cotton shawl over one shoulder (old Indian antariya and uttariya)</text>
<text x="50" y="1010" class="n">• Knee-length wrapped cloth, red sash knotted at the waist</text>
<text x="50" y="1040" class="n">• Ear plugs, bead necklace, bracelets; palm-leaf books</text>
<text x="960" y="150" text-anchor="middle" class="h">B. Bagan traveller</text>
<text x="960" y="178" text-anchor="middle" class="s">from the temple murals, 11th to 13th century</text>
<text x="690" y="950" class="n">• Small topknot with a red tie; large round ear plugs</text>
<text x="690" y="980" class="n">• Short-sleeved upper blouse</text>
<text x="690" y="1010" class="n">• Dhoti-like paso, hitched for walking, in an indigo check</text>
<text x="690" y="1040" class="n">• Wide red sash with a long trailing end</text>
<text x="1600" y="150" text-anchor="middle" class="h">C. Folk-tale classic</text>
<text x="1600" y="178" text-anchor="middle" class="s">the look most Burmese readers picture (Ava to Konbaung)</text>
<text x="1330" y="950" class="n">• Gaung baung head wrap with its knot and trailing end</text>
<text x="1330" y="980" class="n">• White jacket fastened at the side (eingyi)</text>
<text x="1330" y="1010" class="n">• Paso to the ankles, wrapped and knotted at the front</text>
<text x="1330" y="1040" class="n">• Red scarf as his mark; cloth bag; black folding book (parabaik)</text>
</svg>