<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main menu, live and immersive</title>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #0B0D1C; }
.mm { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #10142B; color: #E7DCC6; font-family: 'Crimson Pro', Georgia, serif; }
.cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transition: transform 1.9s cubic-bezier(0.22, 0.7, 0.2, 1), transform-origin 1.9s cubic-bezier(0.22, 0.7, 0.2, 1); }
.handheld { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; animation: mm-handheld 17s ease-in-out infinite; }
.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1), filter 1.5s ease; }
.fill { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
.star { position: absolute; border-radius: 50%; background: #E7DCC6; animation: mm-twinkle ease-in-out infinite; }
.lantern { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #E3B06A; box-shadow: 0 0 12px 4px rgba(211, 154, 78, 0.5), 0 0 52px 18px rgba(211, 154, 78, 0.16); animation: mm-flicker ease-in-out infinite; }
.pool { position: absolute; width: 360px; height: 150px; margin: -30px 0 0 -180px; background: radial-gradient(ellipse at center, rgba(211, 154, 78, 0.2), rgba(211, 154, 78, 0) 70%); mix-blend-mode: screen; animation: mm-flicker ease-in-out infinite; }
.ember { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #E3B06A; box-shadow: 0 0 8px 2px rgba(211, 154, 78, 0.5); animation: mm-ember linear infinite; }
.mote { position: absolute; border-radius: 50%; background: #E7DCC6; animation: mm-mote ease-in-out infinite; }
.mist { position: absolute; border-radius: 50%; background: #9DBBAA; filter: blur(34px); animation: mm-drift 28s ease-in-out infinite alternate; }
.sway { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.sway svg { display: block; width: 1920px; height: 1080px; }
.sway-r { transform-origin: 1840px 1100px; animation: mm-sway 9s ease-in-out infinite alternate; }
.sway-l { transform-origin: -100px 40px; animation: mm-sway-l 11s ease-in-out infinite alternate; }
.hero { position: absolute; left: 1466px; top: 688px; width: 98px; height: 195px; animation: mm-breathe 4.5s ease-in-out infinite alternate; }
.naga-body { animation: mm-coil 13s ease-in-out infinite alternate; }
.naga-eye { animation: mm-blink 9s ease-in-out infinite; }
.scarf { animation: mm-scarf 3.2s ease-in-out infinite alternate; }
.shaft { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; mix-blend-mode: screen; filter: blur(12px); animation: mm-shaft 11s ease-in-out infinite alternate; }
.streak { position: absolute; height: 2px; background: linear-gradient(90deg, rgba(205, 182, 122, 0), rgba(205, 182, 122, 0.55), rgba(205, 182, 122, 0)); filter: blur(1px); animation: mm-streak 8s ease-in-out infinite alternate; }
.bat { position: absolute; left: 0; width: 28px; height: 14px; animation: mm-fly linear infinite; }
.bat svg { display: block; width: 28px; height: 14px; transform-origin: 50% 100%; animation: mm-flap 0.45s ease-in-out infinite alternate; }
.dusk { animation: mm-dusk 150s ease-in-out infinite alternate; }
.title-wrap { animation: mm-lamp 5.5s ease-in-out infinite; }
.title-ink { animation: mm-ink 3s cubic-bezier(0.3, 0.1, 0.2, 1) 0.5s both; }
.item:focus-visible { outline: 1px solid #C4983F; outline-offset: 12px; }
@keyframes mm-handheld { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 20% { transform: translate3d(-3px, 2px, 0) rotate(0.12deg); } 45% { transform: translate3d(2px, -3px, 0) rotate(-0.1deg); } 70% { transform: translate3d(-2px, -1px, 0) rotate(0.08deg); } 100% { transform: translate3d(0, 0, 0) rotate(0deg); } }
@keyframes mm-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
@keyframes mm-flicker { 0% { opacity: 0.75; } 9% { opacity: 0.55; } 18% { opacity: 0.9; } 33% { opacity: 0.7; } 47% { opacity: 1; } 62% { opacity: 0.6; } 78% { opacity: 0.95; } 100% { opacity: 0.75; } }
@keyframes mm-ember { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 15% { opacity: 0.85; } 100% { transform: translate3d(var(--dx), -460px, 0); opacity: 0; } }
@keyframes mm-mote { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 20% { opacity: var(--o); } 80% { opacity: var(--o); } 100% { transform: translate3d(var(--dx), var(--dy), 0); opacity: 0; } }
@keyframes mm-drift { from { transform: translate3d(-150px, 0, 0); } to { transform: translate3d(150px, 0, 0); } }
@keyframes mm-sway { from { transform: rotate(-0.9deg); } to { transform: rotate(0.9deg); } }
@keyframes mm-sway-l { from { transform: rotate(-0.6deg); } to { transform: rotate(0.7deg); } }
@keyframes mm-breathe { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, -3px, 0); } }
@keyframes mm-coil { from { transform: translate3d(0, 8px, 0) rotate(-0.8deg); } to { transform: translate3d(0, -12px, 0) rotate(0.8deg); } }
@keyframes mm-blink { 0%, 90%, 100% { opacity: 1; } 94% { opacity: 0.1; } }
@keyframes mm-scarf { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
@keyframes mm-shaft { from { opacity: 0.45; } to { opacity: 1; } }
@keyframes mm-streak { from { opacity: 0.25; transform: scaleX(0.85); } to { opacity: 0.7; transform: scaleX(1.05); } }
@keyframes mm-fly { from { transform: translate3d(-160px, 0, 0); } to { transform: translate3d(2080px, -90px, 0); } }
@keyframes mm-flap { from { transform: scaleY(1); } to { transform: scaleY(0.4); } }
@keyframes mm-dusk { from { opacity: 1; } to { opacity: 0.05; } }
@keyframes mm-lamp { 0%, 100% { filter: drop-shadow(0 0 10px rgba(211, 154, 78, 0.22)); } 30% { filter: drop-shadow(0 0 18px rgba(211, 154, 78, 0.4)); } 55% { filter: drop-shadow(0 0 8px rgba(211, 154, 78, 0.16)); } 80% { filter: drop-shadow(0 0 16px rgba(211, 154, 78, 0.34)); } }
@keyframes mm-ink { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes mm-grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-24px, 12px); } 40% { transform: translate(18px, -20px); } 60% { transform: translate(-10px, 26px); } 80% { transform: translate(22px, 8px); } 100% { transform: translate(0, 0); } }
@media (prefers-reduced-motion: reduce) { .mm *, .mm { animation: none !important; } .cam, .layer { transition: none !important; } }
</style>

    ];
    const idle = { ox: 960, oy: 560, s: 1.04, tx: 0, ty: 0, far: 0.6, mid: 0, trees: 2.2, dim: 0, lamp: 1, nb: 0.3 };
    const cam = sel >= 0 ? cams[sel] : idle;
    const push = pressed === 0 ? 1.2 : 1;
    const nx = Math.max(-1, Math.min(1, mx * 0.5));
    const ny = Math.max(-1, Math.min(1, my * 0.5));
    const tf = (d) => `translate3d(${(nx * d).toFixed(1)}px, ${(ny * d * 0.4).toFixed(1)}px, 0)`;
    const labels = ['New Game', 'Continue', 'Options', 'Credits', 'Quit'];
    const caps = ['Leave the academy and take the road', 'Return to your notebook', 'Light, sound and controls', 'The people behind the legend', 'Leave the city for now'];
    const palacePts = [[706, 625], [1374, 625], [770, 550], [1310, 550], [826, 482], [1254, 482], [878, 420], [1202, 420], [927, 363], [1153, 363], [520, 794]];
    const wallPts = [[380, 826], [470, 826], [80, 806], [220, 806], [1500, 806], [1600, 806], [1640, 826], [1800, 826]];
    return {
      cam: { ox: cam.ox, oy: cam.oy, s: (cam.s * push).toFixed(3), tx: cam.tx, ty: cam.ty },
      L: {
        sky: tf(3), moon: tf(6), hills: tf(9), mistBack: tf(12), palace: tf(12), shafts: tf(14), naga: tf(16),
        wall: tf(24), hero: tf(28), embers: tf(30), mistFront: tf(40), trees: tf(56), menu: tf(8)
      },
      B: { sky: (cam.far * 0.4).toFixed(1), far: cam.far, mid: cam.mid, trees: cam.trees },
      lampOp: Math.min(1, cam.lamp).toFixed(2),
      nbOp: cam.nb,
      dimOp: cam.dim,
      leaveOp: pressed >= 0 ? 0.92 : 0,
      grain: this.props.grain ?? 0.12,
      dusk: this.props.dusk ?? 0.6,
      stars: range(46).map((i) => ({
        x: Math.round(rnd(i + 1) * 1920),
        y: Math.round(rnd(i + 101) * 520),
        s: 1 + Math.round(rnd(i + 201) * 2),
        t: (3 + rnd(i + 301) * 4).toFixed(2),
        d: (-rnd(i + 401) * 6).toFixed(2)
      })),
      bats: range(3).map((i) => ({
        y: 150 + Math.round(rnd(i + 1300) * 170),
        t: (34 + rnd(i + 1400) * 18).toFixed(1),
        d: (-rnd(i + 1500) * 40).toFixed(1)
      })),
      palaceLanterns: palacePts.map(([x, y], i) => ({
        x, y, t: (2.6 + rnd(i + 500) * 1.8).toFixed(2), d: (-rnd(i + 600) * 4).toFixed(2)
      })),
      wallLanterns: wallPts.map(([x, y], i) => ({
        x, y, t: (2.6 + rnd(i + 520) * 1.8).toFixed(2), d: (-rnd(i + 620) * 4).toFixed(2)
      })),
      embers: range(20).map((i) => ({
        x: Math.round(560 + rnd(i + 700) * 900),
        y: Math.round(760 + rnd(i + 800) * 180),
        dx: Math.round((rnd(i + 900) - 0.5) * 90),
        t: (7 + rnd(i + 1000) * 6).toFixed(2),
        d: (-rnd(i + 1100) * 12).toFixed(2)
      })),
      motes: range(60).map((i) => ({
        x: Math.round(300 + rnd(i + 2000) * 1400),
        y: Math.round(160 + rnd(i + 2100) * 740),
        s: (1 + rnd(i + 2200) * 1.8).toFixed(1),
        dx: Math.round((rnd(i + 2300) - 0.5) * 120),
        dy: Math.round((rnd(i + 2400) - 0.5) * 90),
        o: (0.2 + rnd(i + 2500) * 0.35).toFixed(2),
        t: (16 + rnd(i + 2600) * 18).toFixed(1),
        d: (-rnd(i + 2700) * 30).toFixed(1)
      })),
      items: labels.map((label, i) => ({
        label,
        cap: caps[i],
        x: 60 + Math.round(Math.sin(i * 0.9) * 34) + (i === sel ? 26 : 0),
        y: 48 + i * 84,
        color: i === sel ? '#C4983F' : (sel < 0 ? 'rgba(231, 220, 198, 0.8)' : 'rgba(231, 220, 198, 0.55)'),
        rule: i === sel ? 56 : 0,
        capOp: i === sel ? 1 : 0,
        capY: i === sel ? 0 : -6,
        enter: () => this.setState({ sel: i }),
        press: () => {
          this.setState({ pressed: i });
          setTimeout(() => this.setState({ pressed: -1 }), 2600);
        }
      })),
      leave: () => this.setState({ sel: -1 }),
      move: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        this.setState({
          mx: ((e.clientX - r.left) / r.width) * 2 - 1,
          my: ((e.clientY - r.top) / r.height) * 2 - 1
        });
      }
    };
  }
}
</script>
</body>
</html>
